pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,jsx,tsx,astro,scss,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: '*.{js,ts,jsx,tsx,astro}'
      run: pnpm exec eslint {staged_files}

pre-push:
  commands:
    lint:
      run: pnpm run lint
    type-check:
      run: pnpm run typecheck
    test:unit:
      run: pnpm run test:coverage
